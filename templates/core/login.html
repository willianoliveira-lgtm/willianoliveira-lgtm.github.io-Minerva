{% extends "base.html" %}
{% block title %}Área Restrita · Login{% endblock %}

{% block content %}
<div class="min-h-[80vh] bg-gradient-to-br from-slate-900 via-blue-900 to-slate-900 flex items-center justify-center py-12 px-4">
  <div class="w-full max-w-md rounded-lg border bg-white shadow-sm p-8">
    <div class="text-center mb-6">
      <div class="w-16 h-16 bg-blue-600 rounded-full flex items-center justify-center mx-auto mb-4">
        <i data-lucide="rocket" class="h-8 w-8 text-white"></i>
      </div>
      <h1 class="text-2xl font-bold">Área Restrita</h1>
      <p class="text-gray-500 text-sm">Sistema de Cotações e Aquisições Aeroespaciais</p>
    </div>

    {% if error %}
    <div class="mb-4 rounded-md border border-red-200 bg-red-50 px-4 py-3">
      <p class="text-red-800 text-sm">{{ error }}</p>
    </div>
    {% endif %}

    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div>
        <label for="username" class="block text-sm font-medium mb-1">Usuário</label>
        <div class="relative">
          <i data-lucide="user" class="absolute left-3 top-3 h-4 w-4 text-gray-400"></i>
          <input type="text" id="username" name="username" placeholder="Digite seu usuário" required
                 class="flex h-10 w-full rounded-md border border-gray-300 pl-10 pr-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
      </div>
      <div>
        <label for="password" class="block text-sm font-medium mb-1">Senha</label>
        <div class="relative">
          <i data-lucide="lock" class="absolute left-3 top-3 h-4 w-4 text-gray-400"></i>
          <input type="password" id="password" name="password" placeholder="Digite sua senha" required
                 class="flex h-10 w-full rounded-md border border-gray-300 pl-10 pr-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
      </div>
      <button type="submit"
              class="w-full inline-flex items-center justify-center rounded-md bg-blue-600 text-white px-6 py-2 text-sm font-medium hover:bg-blue-700">
        Entrar
      </button>
    </form>
  </div>
</div>
{% endblock %}
