<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contato — Minerva</title>
<meta name="description" content="Minerva — portal de educação, pesquisa e conhecimento.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦉</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Merriweather:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="contato">
<div id="header"></div>

<section class="page-head"><div class="wrap"><h1>Contato</h1><p>Dúvidas, sugestões de pauta ou parcerias? Escreva para nós.</p></div></section>
<section class="block"><div class="wrap">
  <form class="form" onsubmit="event.preventDefault();const f=this;location.href='mailto:'+SITE.email+'?subject='+encodeURIComponent('['+f.assunto.value+'] '+f.nome.value)+'&body='+encodeURIComponent(f.msg.value+'\n\n— '+f.nome.value+' ('+f.email.value+')')">
    <div><label>Nome</label><input name="nome" required></div>
    <div><label>E-mail</label><input name="email" type="email" required></div>
    <div><label>Assunto</label><select name="assunto"><option>Dúvida</option><option>Sugestão de pauta</option><option>Inscrição em evento</option><option>Parceria</option></select></div>
    <div><label>Mensagem</label><textarea name="msg" rows="6" required></textarea></div>
    <div><button class="btn btn-gold">Enviar mensagem</button></div>
    <p style="color:var(--muted);font-size:.85rem;margin:0">Ao enviar, seu aplicativo de e-mail será aberto com a mensagem pronta.</p>
  </form>
</div></section>

<div id="footer"></div>
<script src="posts.js"></script>
<script src="app.js"></script>
</body>
</html>
