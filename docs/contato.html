<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contato — Minerva</title>
<meta name="description" content="Minerva — pesquisa aplicada, projetos, sistemas e publicações.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232563eb'/><text x='16' y='22' font-family='Arial' font-weight='700' font-size='16' fill='white' text-anchor='middle'>M</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="contato">
<div id="header"></div>
<main>
<section class="sec gray"><div class="container">
  <div class="page-title"><h1>Entre em Contato</h1><p>Estamos à disposição para tirar dúvidas, receber sugestões e discutir parcerias</p></div>
  <div class="contact">
    <div class="card"><div class="hd"><h3>Informações de Contato</h3><p class="desc">Fale com a gente pelos canais abaixo</p></div><div class="ct" style="margin-top:0;padding-top:24px"><div class="info-list" id="info"></div></div></div>
    <div class="card"><div class="hd"><h3>Envie uma Mensagem</h3><p class="desc">Preencha o formulário e responderemos em breve</p></div><div class="ct" style="margin-top:0;padding-top:24px">
      <form class="form" id="form">
        <div class="two"><div class="field"><label for="nome">Nome</label><input id="nome" name="nome" required></div>
        <div class="field"><label for="email">E-mail</label><input id="email" name="email" type="email" required></div></div>
        <div class="field"><label for="assunto">Assunto</label><select id="assunto" name="assunto"><option>Dúvida</option><option>Parceria</option><option>Projetos de pesquisa</option><option>Imprensa</option><option>Outro</option></select></div>
        <div class="field"><label for="msg">Mensagem</label><textarea id="msg" name="msg" rows="6" required></textarea></div>
        <button class="btn btn-primary btn-lg" type="submit">Enviar mensagem</button>
        <div class="notice" id="notice">Seu aplicativo de e-mail foi aberto com a mensagem pronta para envio.</div>
      </form></div></div>
  </div>
</div></section>
</main>
<div id="footer"></div>
<script src="posts.js"></script>
<script src="app.js"></script>
</body>
</html>
